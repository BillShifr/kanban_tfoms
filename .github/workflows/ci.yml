name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format, type, lint, unit and build gates
        run: npm run verify

      - name: Start PostgreSQL for integration tests
        run: docker compose up -d --wait db

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://kanban:kanban@127.0.0.1:5433/kanban

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the application
        run: docker compose up -d --build --wait

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop test containers
        if: always()
        run: docker compose down --volumes
