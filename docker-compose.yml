services:
  db:
    image: postgres:16
    ports: ['127.0.0.1:${KANBAN_DB_PORT:-5433}:5432']
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban -d kanban']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://kanban:kanban@db:5432/kanban
      NODE_ENV: development
      APP_ORIGIN: http://localhost:${KANBAN_WEB_PORT:-5173},http://127.0.0.1:${KANBAN_WEB_PORT:-5173}
      SESSION_COOKIE_SECURE: 'false'
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: change-me-now
      HOST: 0.0.0.0
    ports: ['127.0.0.1:${KANBAN_API_PORT:-3001}:3001']
    volumes: [uploads-data:/app/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ['CMD', 'node', '/app/apps/api/dist/healthcheck.js']
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['127.0.0.1:${KANBAN_WEB_PORT:-5173}:8080']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes: { postgres-data: {}, uploads-data: {} }
